<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" width="760" height="530" role="img" aria-label="IPL league-wide results on pressure and ordinary deliveries"><title>IPL league-wide results on pressure and ordinary deliveries</title><desc>Four panels (batting strike rate, batting dismissals, bowling economy, bowling wickets), each with pressure and ordinary bars for IPL 2022 to 2026. Every value is printed above its bar.</desc><rect x="0" y="0" width="760" height="530" fill="#ffffff"/><rect x="14" y="16" width="12" height="12" fill="#e9684b"/><text x="32" y="27" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1b2920" text-anchor="start">Pressure deliveries</text><rect x="170" y="16" width="12" height="12" fill="#8d998f"/><text x="188" y="27" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1b2920" text-anchor="start">Ordinary deliveries</text><rect x="14" y="46" width="360" height="226" fill="#fbfcf9" stroke="#dce4d9"/><text x="26" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1b2920" text-anchor="start">Batting strike rate</text><text x="26" y="81" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="normal" fill="#647168" text-anchor="start">runs per 100 balls faced</text><line x1="24" y1="238" x2="364" y2="238" stroke="#aeb9af" stroke-width="1"/><g class="group" data-panel="battingSR" data-scope="IPL" data-pressure="156.7" data-ordinary="139.5"><rect x="153" y="92" width="38" height="146" fill="#e9684b"/><text x="172" y="87" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#e9684b" text-anchor="middle" class="v-pressure">156.7</text><rect x="197" y="108.05" width="38" height="129.95" fill="#8d998f"/><text x="216" y="103.05" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#647168" text-anchor="middle" class="v-usual">139.5</text><text x="194" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#1b2920" text-anchor="middle">IPL</text></g><rect x="392" y="46" width="360" height="226" fill="#fbfcf9" stroke="#dce4d9"/><text x="404" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1b2920" text-anchor="start">Batting dismissals</text><text x="404" y="81" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="normal" fill="#647168" text-anchor="start">outs per 100 balls faced</text><line x1="402" y1="238" x2="742" y2="238" stroke="#aeb9af" stroke-width="1"/><g class="group" data-panel="battingOuts" data-scope="IPL" data-pressure="6.61" data-ordinary="4.30"><rect x="531" y="92" width="38" height="146" fill="#e9684b"/><text x="550" y="87" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#e9684b" text-anchor="middle" class="v-pressure">6.61</text><rect x="575" y="143.11" width="38" height="94.89" fill="#8d998f"/><text x="594" y="138.11" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#647168" text-anchor="middle" class="v-usual">4.30</text><text x="572" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#1b2920" text-anchor="middle">IPL</text></g><rect x="14" y="282" width="360" height="226" fill="#fbfcf9" stroke="#dce4d9"/><text x="26" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1b2920" text-anchor="start">Bowling economy</text><text x="26" y="317" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="normal" fill="#647168" text-anchor="start">runs per 6 legal balls</text><line x1="24" y1="474" x2="364" y2="474" stroke="#aeb9af" stroke-width="1"/><g class="group" data-panel="bowlingEconomy" data-scope="IPL" data-pressure="9.80" data-ordinary="8.64"><rect x="153" y="328" width="38" height="146" fill="#e9684b"/><text x="172" y="323" font-family="Segoe UI, Arial, sans-seri